target-version = "py312"
include = [
    "main.py",
    "scripts/**/*.py",
    "src/baxy_mind/**/*.py",
    "tests/**/*.py",
]
force-exclude = true
extend-exclude = [
    "legacy",
]

[lint]
# Pyflakes covers unused imports/locals plus undefined and duplicate bindings
# without imposing unrelated formatting preferences on the historical corpus.
select = ["F"]
