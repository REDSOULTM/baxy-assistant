# Entrenamiento aislado de un KWS BAXY en español.
# Requiere livekit-wakeword con extras train, eval, export y voxcpm.
# No ejecutar dentro del entorno runtime ni con la GPU de 6 GiB de este equipo.
model_name: baxy
target_phrases:
  - "baxy"
  - "baxi"
tts_backend: voxcpm
n_samples: 50000
n_samples_val: 10000
steps: 50000
target_fp_per_hour: 0.1

model:
  model_type: conv_attention
  model_size: medium

# Diversidad deliberada de edad, acento, ritmo, tono y energía. Completar con
# grabaciones consentidas de español chileno y negativos reales antes de aprobar.
voxcpm_tts:
  voice_design_prompts:
