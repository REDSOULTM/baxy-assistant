# Development-only classifier campaign over the hash-bound GGUF VoxCPM2 corpus.
# Do not run LiveKit's `generate` command with this file: speech is generated,
# phoneme-audited, filtered and assembled by the adjacent BAXY scripts.  Run
# only `augment`, `train`, `export`, and development evaluation.  The human
# blind partition remains unavailable until the candidate and threshold freeze.
model_name: baxy_voxcpm2_development_v1
target_phrases:
  - "Baxy"
tts_backend: voxcpm

# These values document the planned minimum split sizes.  They are not used by
# augment/train after assemble_voxcpm2_livekit_corpus.py creates the splits.
n_samples: 900
n_samples_val: 250
n_background_samples: 0
n_background_samples_val: 0

data_dir: D:/BAXYRuntime/experiments/wakeword/livekit_data
output_dir: D:/BAXYRuntime/experiments/wakeword/livekit_output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 3
  background_paths:
    - D:/BAXYRuntime/experiments/wakeword/livekit_data/backgrounds
  rir_paths:
    - D:/BAXYRuntime/experiments/wakeword/livekit_data/rirs

model:
  model_type: conv_attention
  model_size: medium

# A bounded first candidate.  Development evidence decides whether to extend
# steps or compare architecture/size before anything is frozen for blind use.
steps: 8000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 3000
target_fp_per_hour: 0.1

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 512
  background_noise: 0
