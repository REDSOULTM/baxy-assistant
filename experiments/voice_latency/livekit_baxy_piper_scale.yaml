  - "vax"
  - "wacky"
  - "hey Betsy"
  - "hey Bixby"
  - "hey Moxie"
  - "hey Roxy"
  - "Mahesh Faxi"
  - "Viplav Vaxi"
  - "Tarang Bakshi"
  - "Upendra Bakshi"
  - "oye taxi"
  - "hola Maxi"
  - "un taxi"
  - "taxi please"
  - "call Maxi"
  - "anti vaccine"
  - "casi"
  - "asi"

noise_scales: [0.98]
noise_scale_ws: [0.98]
length_scales: [0.75, 1.0, 1.25]
# The initial scale run used interpolated speaker embeddings and produced
# linguistically invalid positive clips (for example "thank you", "taxi" and
# "backseat").  Use the second endpoint exactly: all 904 trained Piper speaker
# embeddings remain represented, while no unseen point is invented between
# them.  The rejected run is preserved in the adjacent research artifact.
slerp_weights: [1.0]

# Models and corpora remain outside Git and outside the installed runtime.
data_dir: D:/BAXYRuntime/experiments/wakeword/livekit_data
output_dir: D:/BAXYRuntime/experiments/wakeword/livekit_output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 3
  background_paths:
    - D:/BAXYRuntime/experiments/wakeword/livekit_data/backgrounds
  rir_paths:
    - D:/BAXYRuntime/experiments/wakeword/livekit_data/rirs

model:
  model_type: conv_attention
  model_size: medium

steps: 100000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 3000
target_fp_per_hour: 0.1

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50
