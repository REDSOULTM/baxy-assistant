[package]
name = "baxy-tauri-rust-slice"
version = "0.1.0"
description = "BAXY round-B Tauri/Rust vertical slice"
edition = "2024"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tauri = { version = "2.11.5", features = [] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
