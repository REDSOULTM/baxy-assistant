# PERFIL DE USUARIO — modo EFFICIENT (el de todos los días).
#
# Plantilla. NO es configuración activa del repositorio: Codex ignora `profiles`
# en un config con ámbito de proyecto. Se instala en $CODEX_HOME con
#     .\.codex\profiles\install.ps1
# y se usa con
#     codex --profile sol-efficient
#
# Para qué: features, debugging, refactors locales, tests, un módulo concreto.
# Es decir, el 90 % del trabajo de los goals.

model = "gpt-5.6-sol"

# El suelo de calidad del proyecto. Súbelo a "xhigh" en la sesión concreta que
# lo merezca (un diseño abierto, un fallo que no se explica), no de forma fija:
# cada peldaño multiplica los tokens de razonamiento.
model_reasoning_effort = "high"
model_verbosity = "low"

# Ventana: NO se toca.
#
# El valor por defecto de Codex para Sol (~272K de entrada, con compactación
# automática antes del límite) es el que está probado. Fijar
# `model_context_window` a mano ha roto la auto-compactación en versiones
# recientes (openai/codex#16068), y una ventana mayor no mejora el resultado si
# el contexto no es el correcto: la degradación por contexto largo empieza mucho
# antes del límite. Para el caso en que 1M sí aporta, usa el perfil sol-deep.

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
